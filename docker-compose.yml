services:
  postgres:
    image: postgres:16-alpine
    container_name: balon-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: balon
    ports:
      - "5432:5432"
    volumes:
      - balon-postgres-data:/var/lib/postgresql/data

volumes:
  balon-postgres-data:
